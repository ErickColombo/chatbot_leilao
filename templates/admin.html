<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editor de Base de Dados - Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body className="bg-light">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function FaqEditor() {
            const [dados, setDados] = useState({ intents: [], desambiguacoes: [] });
            const [salvando, setSalvando] = useState(false);
            const [termoBusca, setTermoBusca] = useState('');

            useEffect(() => {
                fetch('/api/faq')
                    .then(res => res.json())
                    .then(data => setDados(data));
            }, []);

            const salvarDados = async () => {
                setSalvando(true);
                try {
                    await fetch('/api/faq', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dados)
                    });
                    alert('Base de dados salva com sucesso! Lembre-se de rodar o train.py para que o modelo aprenda as novas regras.');
                } catch (error) {
                    alert('Erro ao salvar os dados.');
                }
                setSalvando(false);
            };

            const adicionarIntent = () => {
                const novaIntent = { intent: "nova_intent", perguntas: [""], resposta: "" };
                setDados({ ...dados, intents: [novaIntent, ...dados.intents] });
                setTermoBusca(''); // Limpa a busca para que a nova intent fique visível
            };

            const atualizarIntent = (index, campo, valor) => {
                const novasIntents = [...dados.intents];
                novasIntents[index][campo] = valor;
                setDados({ ...dados, intents: novasIntents });
            };

            const atualizarPergunta = (intentIndex, perguntaIndex, valor) => {
                const novasIntents = [...dados.intents];
                novasIntents[intentIndex].perguntas[perguntaIndex] = valor;
                setDados({ ...dados, intents: novasIntents });
            };

            const adicionarPergunta = (intentIndex) => {
                const novasIntents = [...dados.intents];
                novasIntents[intentIndex].perguntas.push("");
                setDados({ ...dados, intents: novasIntents });
            };

            const removerPergunta = (intentIndex, perguntaIndex) => {
                const novasIntents = [...dados.intents];
                novasIntents[intentIndex].perguntas.splice(perguntaIndex, 1);
                setDados({ ...dados, intents: novasIntents });
            };

            // Lógica de filtragem
            const intentsFiltradas = dados.intents.filter(item => {
                const termo = termoBusca.toLowerCase();
                const intentMatch = item.intent.toLowerCase().includes(termo);
                const respostaMatch = item.resposta.toLowerCase().includes(termo);
                const perguntasMatch = item.perguntas.some(p => p.toLowerCase().includes(termo));
                return intentMatch || respostaMatch || perguntasMatch;
            });

            return (
                <div className="container py-5">
                    <div className="d-flex justify-content-between align-items-center mb-4">
                        <h2>Gestão de Conhecimento do Chatbot</h2>
                        <button className="btn btn-success" onClick={salvarDados} disabled={salvando}>
                            {salvando ? 'Salvando...' : 'Salvar Alterações'}
                        </button>
                    </div>

                    {/* Barra de Pesquisa */}
                    <div className="mb-4">
                        <input
                            type="text"
                            className="form-control form-control-lg shadow-sm"
                            placeholder="🔍 Pesquisar por nome da intent, pergunta de treinamento ou resposta..."
                            value={termoBusca}
                            onChange={e => setTermoBusca(e.target.value)}
                        />
                    </div>

                    <div className="card shadow-sm mb-4">
                        <div className="card-header d-flex justify-content-between align-items-center bg-white">
                            <h4 className="mb-0">
                                Intents ({intentsFiltradas.length} de {dados.intents.length})
                            </h4>
                            <button className="btn btn-primary btn-sm" onClick={adicionarIntent}>+ Nova Intent</button>
                        </div>
                        <div className="card-body bg-light">
                            {intentsFiltradas.length === 0 ? (
                                <div className="text-center text-muted py-5">
                                    Nenhuma intent encontrada para "<strong>{termoBusca}</strong>".
                                </div>
                            ) : (
                                intentsFiltradas.map((item) => {
                                    // Localiza o índice real no array original para garantir que as edições
                                    // salvem na intent correta, mesmo quando a lista estiver filtrada.
                                    const originalIndex = dados.intents.findIndex(orig => orig === item);
                                    
                                    return (
                                        <div key={originalIndex} className="border rounded p-4 mb-3 bg-white shadow-sm">
                                            <div className="mb-3">
                                                <label className="form-label fw-bold text-primary">Nome da Intent (ID)</label>
                                                <input 
                                                    type="text" className="form-control font-monospace" 
                                                    value={item.intent} 
                                                    onChange={e => atualizarIntent(originalIndex, 'intent', e.target.value)} 
                                                />
                                            </div>
                                            
                                            <div className="mb-3">
                                                <label className="form-label fw-bold d-flex justify-content-between align-items-center">
                                                    <span>Perguntas de Treinamento</span>
                                                    <button className="btn btn-outline-secondary btn-sm" onClick={() => adicionarPergunta(originalIndex)}>+ Adicionar Pergunta</button>
                                                </label>
                                                {item.perguntas.map((perg, pIndex) => (
                                                    <div key={pIndex} className="input-group mb-2">
                                                        <input 
                                                            type="text" className="form-control" 
                                                            value={perg} 
                                                            onChange={e => atualizarPergunta(originalIndex, pIndex, e.target.value)}
                                                            placeholder="Ex: Como faço um lance?"
                                                        />
                                                        <button className="btn btn-outline-danger" onClick={() => removerPergunta(originalIndex, pIndex)}>X</button>
                                                    </div>
                                                ))}
                                            </div>

                                            <div>
                                                <label className="form-label fw-bold text-success">Resposta do Bot</label>
                                                <textarea 
                                                    className="form-control" rows="3" 
                                                    value={item.resposta} 
                                                    onChange={e => atualizarIntent(originalIndex, 'resposta', e.target.value)}
                                                ></textarea>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FaqEditor />);
    </script>
</body>
</html>
